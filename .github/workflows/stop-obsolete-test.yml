name: Stop obsolete test run
on:
  push:
    paths: ['.github/workflows/stop-obsolete-test.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop the superseded unbounded test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/bdredenbach/Windows-Android-Launcher/actions/runs/41240251553/cancel
