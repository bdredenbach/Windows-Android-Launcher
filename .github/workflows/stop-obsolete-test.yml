name: Stop obsolete test runs
on:
  push:
    paths: ['.github/workflows/stop-obsolete-test.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Finish cancellation of the two superseded test runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 41240251553 41240786613; do
            run_status=$(gh api repos/bdredenbach/Windows-Android-Launcher/actions/runs/$run_id --jq .status)
            if [ "$run_status" != completed ]; then
              gh api --method POST repos/bdredenbach/Windows-Android-Launcher/actions/runs/$run_id/force-cancel
            fi
          done
