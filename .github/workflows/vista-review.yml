name: Vista competitor research
on:
  push:
    branches: [research/vista-launcher-review]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Download the author's published APK
        run: |
          curl -fL --retry 2 https://github.com/jovanovski/windowslauncher/releases/download/v2.1.6/app-release.apk -o /tmp/windows-launcher.apk
          echo '574609b55ebffcad27d1a6d41808e6cadd48c644e1a35c2dc5edc62e7cb0e9c7  /tmp/windows-launcher.apk' | sha256sum -c
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and inspect the Vista theme
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            adb root
            adb wait-for-device
            adb install /tmp/windows-launcher.apk
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 research/vista-review/review_driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vista-competitor-observations
          path: research/vista-review/evidence/
