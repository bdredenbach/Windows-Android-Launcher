name: Android build
on:
  push:
    branches: [main, feature/aero-startup]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check launcher state and layout geometry
        run: |
          mkdir -p build/state-check
          javac -d build/state-check app/src/main/java/com/nthexperience/desktop/LauncherState.java checks/LauncherStateCheck.java app/src/main/java/com/nthexperience/desktop/DesktopGeometry.java checks/DesktopGeometryCheck.java app/src/main/java/com/nthexperience/desktop/StartupPolicy.java checks/StartupPolicyCheck.java
          java -cp build/state-check LauncherStateCheck
          java -cp build/state-check DesktopGeometryCheck
          java -cp build/state-check StartupPolicyCheck
      - run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: Nth-Desktop-0.6.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Keep APK verification tool for the handoff
        if: matrix.api == 30
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tool/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: APK-verification-tool
          path: build/signing-tool/apksigner.jar
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'google_apis' }}
          profile: ${{ matrix.api == 30 && 'pixel_2' || 'pixel_7' }}
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            bash checks/run-emulator-checks.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Launcher-emulator-evidence-${{ matrix.api }}
          path: |
            smoke-test.txt
            aero-test.txt
            reboot-test.txt
            screenshots/
