plugins { id 'com.android.application' }
android {
    namespace 'com.nthexperience.desktop'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nthexperience.desktop'
        minSdk 26
        targetSdk 36
        versionCode 27
        versionName '0.22.3'
        testInstrumentationRunner 'com.nthexperience.desktop.StorageSmoke'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The engine is the installed Android WebView, independently updated by its provider.
dependencies { implementation "androidx.webkit:webkit:1.13.0" }
