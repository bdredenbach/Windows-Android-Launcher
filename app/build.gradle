plugins { id 'com.android.application' }
android {
    namespace 'com.nthexperience.desktop'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nthexperience.desktop'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'com.nthexperience.desktop.LauncherSmoke'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
